name = "hold-ai-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# NOT a free-tier allowance — AI-assisted drafting is Hold+-only, gated
# client-side in draftService.ts. This is a blunt per-install monthly
# safety cap against runaway cost from a leaked APP_CLIENT_KEY, a client
# bug, or direct abuse of this endpoint, since it's reachable independent
# of the app's own gating and Hold+ has no server-verifiable entitlement
# to check against yet. 20 is a generous ceiling for genuine Hold+ usage,
# not a target. Adjust here without a code change.
[vars]
MONTHLY_DRAFT_SAFETY_CAP = "20"

# Safeguarding classifier's own monthly safety cap, separate from drafting —
# see worker/src/safeguarding.ts. Higher than the draft cap since a check can
# run per keystroke-pause, not per deliberate Send. The detection content
# itself is a PLACEHOLDER, only ever reachable from a __DEV__-gated app build
# — see hold-book 06-privacy-security/03-safeguarding.md.
SAFEGUARD_CHECK_SAFETY_CAP = "60"

# Created via `npm run kv:create` (needs wrangler login first) — paste the
# resulting id below before deploying. Stores per-install monthly draft
# counts only (an anonymous UUID + a number), nothing identifying.
[[kv_namespaces]]
binding = "AI_USAGE"
id = "e5add2732b6545029c7def37fc747899"

# Secrets (never in this file, set via `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY  — the real Claude API key.
#   APP_CLIENT_KEY     — shared secret checked against the app's request
#                        header, filtering casual abuse. Not a strong
#                        secret on its own (extractable from the app
#                        binary) — the rate limit + monthly cap above are
#                        the actual protection, this just adds a floor.
